version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: document-ingestion-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__InvoicesDb=Data Source=/app/data/invoices.db
      - JwtSettings__Secret=YourSuperSecretKeyForDevelopmentThatIsAtLeast32CharactersLong!
      - JwtSettings__Issuer=DocumentIngestionApi
      - JwtSettings__Audience=DocumentIngestionClient
      - JwtSettings__ExpirationMinutes=120
    volumes:
      - backend-data:/app/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: document-ingestion-frontend
    ports:
      - "3000:80"
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
